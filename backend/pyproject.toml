[project]
name = "app"
version = "0.1.0"
description = "pastry shop backend"
readme = "README.md"
authors = [
    { name = "Geger-Metov", email = "205748080+Geger-Metov@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# asyncpg-соединения привязаны к event loop: один loop на всю сессию тестов,
# иначе фикстура engine (scope=session) и тесты окажутся в разных loop
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "C4", "DTZ", "PERF", "TC"]
# RUF001-003: в комментариях и строках осознанно кириллица
# PT011: pytest.raises(ValueError) без match - привычка проекта, tests/ проверяют типы ошибок
ignore = ["RUF001", "RUF002", "RUF003", "PT011"]

# Чтобы автоматически созданные миграции больше не вызывали ошибки
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"

# Включаем строгий режим (рекомендуется для новых проектов)
strict = true

# Игнорировать ошибки в сторонних библиотеках, у которых нет типов
ignore_missing_imports = true

# Не проверять типы в тестах, если это не нужно
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
