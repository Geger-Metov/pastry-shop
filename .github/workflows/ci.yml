name: CI

# запуск CI при каждом push и pull request
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src tests
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=html
      # Отчёт нужен один (на версии, как в продакшене), а не по одному на каждую версию Python
      - name: Coverage summary
        if: matrix.python-version == '3.15'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: matrix.python-version == '3.15'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

  frontend:
    name: frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # Типы фронтенда (schema.d.ts) генерируются из схемы бэкенда. Если поменять API
  # и забыть выполнить `pnpm gen:api`, закоммиченный файл устареет: ловим это здесь.
  api-types:
    name: API types are up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # create_app() читает настройки из окружения; к базе при этом не подключается
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      SHOP_CURRENCY: KGS
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Dump OpenAPI schema from the backend
        working-directory: backend
        run: >-
          uv run python -c
          "import json; from app.main import create_app; print(json.dumps(create_app().openapi()))"
          > "$RUNNER_TEMP/openapi.json"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regenerate frontend API types
        working-directory: frontend
        run: pnpm exec openapi-typescript "$RUNNER_TEMP/openapi.json" -o src/lib/api/schema.d.ts
      - name: Format generated types with Prettier
        working-directory: frontend
        run: pnpm exec prettier --write src/lib/api/schema.d.ts
      - name: Fail if the committed types differ
        run: git diff --exit-code -- frontend/src/lib/api/schema.d.ts

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend, frontend]
    env:
      # Compose takes these from the environment, so no .env file is needed
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SHOP_CURRENCY: USD
      PHONE_DEFAULT_COUNTRY_CODE: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the backend and the frontend
        run: |
          curl -fsS --retry 40 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8000/health
          curl -fsS --retry 40 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/ru

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps firefox
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps firefox
      - name: Run Playwright tests
        working-directory: frontend
        run: pnpm exec playwright test --project=firefox

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down -v
